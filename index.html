<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .description-text { white-space: pre-wrap; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans">

    <header class="sticky top-0 z-50 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800 p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 text-xl font-bold tracking-tighter text-blue-500">
                <i data-lucide="play-circle"></i>
                <span>VIDEO LIBRARY</span>
            </div>
            <div class="text-xs text-zinc-500">管理者モード</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-12">
        
        <div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl">
            <video controls class="w-full aspect-video bg-black">
                <source src="videos/sample.mp4" type="video/mp4">
                ブラウザが対応していません。
            </video>
            
            <div class="p-6">
                <h2 class="text-2xl font-bold mb-2">ここに動画のタイトル</h2>
                <div class="flex items-center gap-6 text-zinc-400 text-sm mb-4">
                    <span>2026/02/09 投稿</span>
                    <span class="flex items-center gap-1"><i data-lucide="thumbs-up" class="w-4 h-4"></i> 10 Good</span>
                </div>
                
                <hr class="border-zinc-800 my-4">
                
                <h3 class="text-sm font-bold text-zinc-500 mb-2 uppercase tracking-widest">概要欄</h3>
                <p class="description-text text-zinc-300 leading-relaxed">
ここに動画の説明を書きます。
改行もそのまま反映されます。

【重要ルール】
このアドオンはMODBAYとMCPEDL専用です。許可なく他のサイトに公開してはいけません。
                </p>
            </div>
        </div>

    </main>

    <footer class="p-10 text-center text-zinc-600 text-xs border-t border-zinc-900 mt-20">
        &copy; 2026 My Video Library. Authorized for MODBAY & MCPEDL only.
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
