<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .description-text { white-space: pre-wrap; word-break: break-all; }
        body { background-color: #0f0f0f; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 10px; }
    </style>
</head>
<body class="text-white font-sans">

    <nav class="fixed top-0 w-full bg-[#0f0f0f] flex items-center justify-between px-4 h-14 z-50 border-b border-zinc-800">
        <div class="flex items-center gap-4">
            <button class="p-2 hover:bg-zinc-800 rounded-full"><i data-lucide="menu"></i></button>
            <div class="flex items-center gap-1 text-xl font-bold tracking-tighter cursor-pointer">
                <i data-lucide="play" class="fill-red-600 text-red-600 w-7 h-7"></i>
                <span class="uppercase tracking-tight">Video <span class="text-blue-500">Library</span></span>
            </div>
        </div>
        
        <div class="hidden md:flex items-center flex-1 max-w-[700px] ml-10">
            <div class="flex w-full overflow-hidden border border-zinc-700 rounded-full bg-zinc-900/50">
                <input type="text" placeholder="検索" class="w-full bg-transparent px-4 py-2 outline-none focus:border-blue-500 text-sm">
                <button class="bg-zinc-800 px-5 border-l border-zinc-700 hover:bg-zinc-700">
                    <i data-lucide="search" class="w-5 h-5 text-zinc-300"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button class="p-2 hover:bg-zinc-800 rounded-full"><i data-lucide="video"></i></button>
            <button class="p-2 hover:bg-zinc-800 rounded-full"><i data-lucide="bell"></i></button>
            <div class="w-8 h-8 bg-zinc-700 rounded-full flex items-center justify-center font-bold text-sm">V</div>
        </div>
    </nav>

    <div class="pt-14 flex flex-col items-center w-full">
        <main class="w-full max-w-[1200px] p-4 lg:p-8">
            
            <div class="aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
                <iframe 
                    class="w-full h-full" 
                    src="https://drive.google.com/file/d/1P1EtFTuk3dGBUcBKFklXYhrZm5YlTW7u/preview" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
            
            <h1 class="text-2xl font-bold mt-6 mb-4">この動画で使用している文字・フォントについて</h1>
            
            <div class="flex items-center justify-end mb-6">
                <button id="sub-btn" onclick="toggleSub()" class="bg-white text-black px-8 py-2.5 rounded-full text-sm font-bold hover:bg-zinc-200 transition-all duration-200">
                    チャンネル登録
                </button>
            </div>

            <div class="bg-zinc-800/60 hover:bg-zinc-800/80 transition-colors rounded-2xl p-5 w-full">
                <p class="font-bold text-sm mb-3 text-zinc-100">2026/02/09 投稿</p>
                <div class="description-text text-[15px] leading-relaxed text-zinc-300">
立ち絵素材YouTube➡　<a href="https://www.youtube.com/channel/UCVMhSwMzJRbaMsvHdsCgu1g" target="_blank" class="text-blue-400 hover:underline">https://www.youtube.com/channel/UCVMhSwMzJRbaMsvHdsCgu1g</a>
　
配布サイト➡　<a href="https://kumasannosozaiya.studio.site/" target="_blank" class="text-blue-400 hover:underline">https://kumasannosozaiya.studio.site/</a>

---------------------------------------
【重要ルール】
このアドオンはMODBAYとMCPEDL専用です。
許可なく他のサイトに公開してはいけません。
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function toggleSub() {
            const btn = document.getElementById('sub-btn');
            if (btn.innerText === 'チャンネル登録') {
                btn.innerText = '登録済み';
                btn.classList.replace('bg-white', 'bg-zinc-800');
                btn.classList.replace('text-black', 'text-zinc-400');
            } else {
                btn.innerText = 'チャンネル登録';
                btn.classList.replace('bg-zinc-800', 'bg-white');
                btn.classList.replace('text-zinc-400', 'text-black');
            }
        }
    </script>
</body>
</html>
